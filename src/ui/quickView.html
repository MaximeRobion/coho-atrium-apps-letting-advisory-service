<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettings Advice Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../design/coho.css">
</head>
<body>
  <!-- Icons from design/icons.svg (COHO design guide). -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="icon-chat" viewBox="0 0 30 30"><path d="M4 6c0-1.1.9-2 2-2h18c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H12l-5.2 4.1c-.7.5-1.8 0-1.8-.9V20H6c-1.1 0-2-.9-2-2V6zm3 3v2h16V9H7zm0 4v2h10v-2H7z"/></symbol>
    <symbol id="icon-library" viewBox="0 0 30 30"><path d="M6 5h4v20H6V5zm6 0h4v20h-4V5zm6 2.2 4 1.2v15.4l-4-1.2V7.2zM4 25h22v2H4v-2z"/></symbol>
  </svg>

  <main id="las-shell">
    <div id="las-tabs" aria-label="Lettings Advice sections">
      <div id="las-tab-chrome">
        <div id="las-tablist" role="tablist">
          <a href="javascript:void(0);" role="tab" id="nav-library" aria-controls="panel-library" aria-selected="true">Library</a>
          <a href="javascript:void(0);" role="tab" id="nav-chat" aria-controls="panel-chat" aria-selected="false">Chat</a>
        </div>
      </div>
      <div id="las-tab-panes">
        <section id="panel-library" role="tabpanel" aria-labelledby="nav-library">
          <div id="library-host">
            <iframe
              id="library-frame"
              title="Lettings Advice Service document library"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </section>
        <section id="panel-chat" role="tabpanel" aria-labelledby="nav-chat" hidden>
          <p id="chat-error" class="u-text--small u-margin-bottom--10" role="alert" hidden></p>
          <div id="tawk-host">
            <div id="tawk-embed"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    // Theme script (design.md section 1). Served bootstrap may re-apply; checker reads this static page.
    function applyTheme(theme) {
      var next = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      document.body.classList.toggle('coho__dark', next === 'dark');
    }
    var fromQuery = new URLSearchParams(location.search).get('theme');
    if (fromQuery === 'dark' || fromQuery === 'light') applyTheme(fromQuery);
  </script>
  <script>
/* __BOOTSTRAP__ */
__SCRIPT__
  </script>
</body>
</html>
