<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettings Advice Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

    <symbol id="icon-chat" viewBox="0 0 30 30"><path d="M4 6c0-1.1.9-2 2-2h18c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H12l-5.2 4.1c-.7.5-1.8 0-1.8-.9V20H6c-1.1 0-2-.9-2-2V6zm3 3v2h16V9H7zm0 4v2h10v-2H7z"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 30 30"><path d="M18.7 6.3c.7.7.7 1.8 0 2.5L13.5 14l5.2 5.2c.7.7.7 1.8 0 2.5-.7.7-1.8.7-2.5 0l-6.5-6.5c-.7-.7-.7-1.8 0-2.5l6.5-6.5c.7-.6 1.8-.6 2.5.1z"/></symbol>

  </svg>

  <main class="u-padding-left--20 u-padding-right--20 u-padding-bottom--20">
    <section id="screen-home" class="page__section page__section--narrow las-screen">
      <h1 class="heading--1 u-margin-top--20 u-margin-bottom--10">Lettings Advice Service</h1>
      <p class="lede u-margin-bottom--20">
        Chat with Julie’s lettings advice team from COHO. Store install grants access; there is no in-app billing in this release.
      </p>
      <p class="u-text--small u-margin-bottom--20" id="home-hint">
        Document library is coming soon.
      </p>
      <div class="button__group">
        <div class="button__group-item">
          <button type="button" id="open-chat" class="button">Open chat</button>
        </div>
        <div class="button__group-item">
          <button type="button" id="close-home" class="button button--cancel">Close</button>
        </div>
      </div>
    </section>

    <section id="screen-chat" class="page__section page__section--narrow las-screen" hidden>
      <div class="heading--section u-margin-top--20">
        <h2 class="heading--2">Chat</h2>
      </div>
      <p id="chat-status" class="u-text--small u-margin-bottom--10" role="status"></p>
      <div id="tawk-host" class="las-tawk-host" aria-live="polite">
        <div id="tawk-embed" class="las-tawk-embed"></div>
      </div>
      <div class="button__group u-margin-top--20">
        <div class="button__group-item">
          <button type="button" id="back-home" class="button button--cancel">Back</button>
        </div>
        <div class="button__group-item">
          <button type="button" id="close-chat" class="button button--cancel">Close</button>
        </div>
      </div>
    </section>
  </main>

  <script>
/* __BOOTSTRAP__ */
__SCRIPT__
  </script>
</body>
</html>
